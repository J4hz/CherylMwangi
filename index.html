  <body>
    <!--
      Boot skeleton. React clears #root on its first render, so this is only ever
      on screen between first paint and hydration. It is inline-styled on purpose:
      the stylesheet may not have arrived yet, and an unstyled skeleton is worse
      than none. Keep it in rough proportion to the real masthead.
    -->
    <style>
      @keyframes boot-pulse { 0%, 100% { opacity: 1 } 50% { opacity: 0.45 } }
      .boot { padding: 0; margin: 0; font-family: system-ui, sans-serif; }
      .boot-bar { background: #DCE6DC; border-radius: 4px; }
      .boot-fade { animation: boot-pulse 1.8s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) { .boot-fade { animation: none } }
    </style>
    <div id="root">
      <div class="boot" aria-hidden="true">
        <div style="height:4.5rem;border-bottom:1px solid #DCE6DC"></div>
        <div class="boot-fade" style="max-width:82rem;margin:0 auto;padding:4rem 1.25rem 3.5rem">
          <div class="boot-bar" style="height:.75rem;width:8rem"></div>
          <div class="boot-bar" style="height:3.5rem;width:100%;max-width:44rem;margin-top:2rem"></div>
          <div class="boot-bar" style="height:3.5rem;width:70%;max-width:32rem;margin-top:1rem"></div>
          <div class="boot-bar" style="height:1rem;width:100%;max-width:36rem;margin-top:2.5rem"></div>
          <div class="boot-bar" style="height:1rem;width:80%;max-width:30rem;margin-top:.75rem"></div>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
